AWSTemplateFormatVersion: "2010-09-09"
Description: Create Elastic Beanstalk application and environment

Resources:
  DemoApplication:
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: demo-app
      Description: Demo Elastic Beanstalk application

  DemoEnvironment:
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      EnvironmentName: demo-env
      ApplicationName: !Ref DemoApplication
      SolutionStackName: "64bit Amazon Linux 2 v3.5.2 running Python 3.8"
      OptionSettings:
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: InstanceType
          Value: t3.micro
