AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates a KMS key whose policy separates duties: one role administers
  the key but cannot use it for encryption, another role can encrypt and
  decrypt but cannot manage the key, and AWS services can create grants.

Parameters:
  AdminRoleArn:
    Type: String
    Description: ARN of the role that manages the key

  UserRoleArn:
    Type: String
    Description: ARN of the role that uses the key for encryption

Resources:
  AppKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Key with separated administrators and users
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIamPermissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Ref AdminRoleArn
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: AllowKeyUsage
            Effect: Allow
            Principal:
              AWS: !Ref UserRoleArn
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
          - Sid: AllowGrantsForAwsServices
            Effect: Allow
            Principal:
              AWS: !Ref UserRoleArn
            Action:
              - kms:CreateGrant
              - kms:ListGrants
              - kms:RevokeGrant
            Resource: '*'
            Condition:
              Bool:
                kms:GrantIsForAWSResource: 'true'

  AppKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/practice-admins-users
      TargetKeyId: !Ref AppKey

Outputs:
  KeyArn:
    Description: ARN of the key
    Value: !GetAtt AppKey.Arn

  AliasName:
    Description: Use this alias in applications
    Value: !Ref AppKeyAlias