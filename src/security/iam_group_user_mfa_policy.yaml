AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an IAM group with a managed policy that denies everything except
  MFA setup until the user signs in with MFA, plus one user in that group.
  The user gets no password or access keys from this template.

Parameters:
  UserName:
    Type: String
    Default: practice-developer
    Description: Name of the IAM user to create

Resources:
  RequireMfaPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Deny all actions except MFA self-service when MFA is not present
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyAllExceptMfaSetupWithoutMfa
            Effect: Deny
            NotAction:
              - iam:ChangePassword
              - iam:CreateVirtualMFADevice
              - iam:EnableMFADevice
              - iam:ListMFADevices
              - iam:ListVirtualMFADevices
              - iam:ResyncMFADevice
              - sts:GetSessionToken
            Resource: '*'
            Condition:
              BoolIfExists:
                aws:MultiFactorAuthPresent: 'false'

  DevelopersGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub '${AWS::StackName}-developers'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
        - !Ref RequireMfaPolicy

  DeveloperUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref UserName
      Groups:
        - !Ref DevelopersGroup

Outputs:
  GroupName:
    Description: Add more users to this group
    Value: !Ref DevelopersGroup

  UserArn:
    Description: ARN of the IAM user
    Value: !GetAtt DeveloperUser.Arn

  PolicyArn:
    Description: Policy that enforces MFA
    Value: !Ref RequireMfaPolicy