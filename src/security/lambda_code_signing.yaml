AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an AWS Signer signing profile and a Lambda code signing config
  that rejects any deployment package not signed by that profile.

Resources:
  LambdaSigningProfile:
    Type: AWS::Signer::SigningProfile
    Properties:
      PlatformId: AWSLambda-SHA384-ECDSA
      SignatureValidityPeriod:
        Type: MONTHS
        Value: 12

  CodeSigning:
    Type: AWS::Lambda::CodeSigningConfig
    Properties:
      Description: Only allow code signed by the practice profile
      AllowedPublishers:
        SigningProfileVersionArns:
          - !GetAtt LambdaSigningProfile.ProfileVersionArn
      CodeSigningPolicies:
        UntrustedArtifactOnDeployment: Enforce

Outputs:
  CodeSigningConfigArn:
    Description: Set this as CodeSigningConfigArn on a Lambda function
    Value: !Ref CodeSigning

  SigningProfileVersionArn:
    Description: Profile version that is trusted
    Value: !GetAtt LambdaSigningProfile.ProfileVersionArn