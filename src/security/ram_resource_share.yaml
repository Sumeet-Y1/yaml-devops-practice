AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an AWS Resource Access Manager (RAM) resource share that shares
  a subnet with another AWS account.

Parameters:
  SubnetArn:
    Type: String
    Description: ARN of the subnet to share

  PrincipalId:
    Type: String
    Description: 12-digit account ID (or organization/OU ARN) to share with

Resources:
  SubnetShare:
    Type: AWS::RAM::ResourceShare
    Properties:
      Name: !Sub '${AWS::StackName}-subnet-share'
      ResourceArns:
        - !Ref SubnetArn
      Principals:
        - !Ref PrincipalId
      AllowExternalPrincipals: false
      Tags:
        - Key: Purpose
          Value: shared-networking

Outputs:
  ResourceShareArn:
    Description: ARN of the resource share
    Value: !Ref SubnetShare