AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::SecretsManager-2020-07-23
Description: >
  Creates a Secrets Manager secret for an RDS MySQL instance and rotates it
  every 30 days using a hosted rotation function (no Lambda code to write).

Parameters:
  DbInstanceId:
    Type: String
    Description: Identifier of the existing RDS MySQL instance

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets the rotation function runs in (must reach the database)

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for the rotation function

Resources:
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/db-credentials'
      Description: Database credentials rotated automatically
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: '"@/\'

  SecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbSecret
      TargetId: !Ref DbInstanceId
      TargetType: AWS::RDS::DBInstance

  RotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: SecretAttachment
    Properties:
      SecretId: !Ref DbSecret
      HostedRotationLambda:
        RotationType: MySQLSingleUser
        RotationLambdaName: !Sub '${AWS::StackName}-rotation'
        VpcSecurityGroupIds: !Ref SecurityGroupId
        VpcSubnetIds: !Join [',', !Ref SubnetIds]
      RotationRules:
        AutomaticallyAfterDays: 30

Outputs:
  SecretArn:
    Description: ARN of the rotated secret
    Value: !Ref DbSecret