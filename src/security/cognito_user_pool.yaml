AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an Amazon Cognito user pool with a password policy, an app client,
  a hosted UI domain, and an admins group.

Parameters:
  DomainPrefix:
    Type: String
    Description: Globally unique lowercase prefix for the hosted UI domain (avoid the words aws, amazon, cognito)
    AllowedPattern: '[a-z0-9][a-z0-9-]{2,62}'

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web-app
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: admins
      Description: Administrators

Outputs:
  UserPoolId:
    Description: Cognito user pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: App client ID
    Value: !Ref UserPoolClient

  HostedUiDomain:
    Description: Hosted UI base URL
    Value: !Sub 'https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com'