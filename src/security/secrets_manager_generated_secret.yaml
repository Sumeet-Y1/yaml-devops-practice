AWSTemplateFormatVersion: '2010-09-09'
Description: Secrets Manager secret with a randomly generated password so no credential is ever written in the template

Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub '${AWS::StackName}/db-credentials'
      Description: Generated credentials for the application database user
      GenerateSecretString:
        SecretStringTemplate: '{"username": "appuser"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

Outputs:
  SecretArn:
    Description: ARN of the generated secret
    Value: !Ref DatabaseSecret