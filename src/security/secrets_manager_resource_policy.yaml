AWSTemplateFormatVersion: '2010-09-09'
Description: Secrets Manager secret with a resource-based policy that grants the account read access and blocks any public policy

Resources:
  ApiSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub '${AWS::StackName}/api-key'
      Description: Generated API key with a resource policy
      GenerateSecretString:
        SecretStringTemplate: '{"service": "practice-api"}'
        GenerateStringKey: apiKey
        PasswordLength: 32
        ExcludePunctuation: true

  ApiSecretPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref ApiSecret
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountToReadSecret
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: '*'

Outputs:
  SecretArn:
    Description: ARN of the secret
    Value: !Ref ApiSecret