AWSTemplateFormatVersion: '2010-09-09'
Description: IAM role that another AWS account can assume only when it supplies the agreed external ID

Parameters:
  TrustedAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
    Description: 12-digit ID of the account allowed to assume the role
  ExternalId:
    Type: String
    MinLength: 8
    Description: Shared external ID the caller must present

Resources:
  CrossAccountReadRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Read-only access for a trusted external account
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${TrustedAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ViewOnlyAccess

Outputs:
  RoleArn:
    Description: Role ARN the trusted account assumes
    Value: !GetAtt CrossAccountReadRole.Arn