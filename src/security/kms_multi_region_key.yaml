AWSTemplateFormatVersion: '2010-09-09'
Description: Multi-Region primary KMS key with rotation and an alias so replica keys can be created in other Regions

Resources:
  PrimaryMultiRegionKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: Multi-Region primary key for practice
      MultiRegion: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountPermissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'

  PrimaryKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-multi-region'
      TargetKeyId: !Ref PrimaryMultiRegionKey

Outputs:
  KeyArn:
    Description: ARN of the multi-Region primary key
    Value: !GetAtt PrimaryMultiRegionKey.Arn
  KeyId:
    Description: Key ID shared by every replica of this key
    Value: !Ref PrimaryMultiRegionKey