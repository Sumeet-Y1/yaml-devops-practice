AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates a Systems Manager hybrid activation so servers outside AWS
  (on-premises or other clouds) can register as managed instances.

Parameters:
  RegistrationLimit:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000
    Description: Maximum number of machines that can register with this activation

Resources:
  HybridServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  HybridActivation:
    Type: AWS::SSM::Activation
    Properties:
      Description: Activation for on-premises practice servers
      DefaultInstanceName: practice-onprem
      IamRole: !Ref HybridServiceRole
      RegistrationLimit: !Ref RegistrationLimit
      Tags:
        - Key: Purpose
          Value: hybrid-management

Outputs:
  ActivationId:
    Description: Pass to the SSM Agent registration command with the code
    Value: !Ref HybridActivation

  ActivationCode:
    Description: Treat this like a secret, anyone with it can register a server
    Value: !GetAtt HybridActivation.ActivationCode