AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates a Secrets Manager secret that is replicated to a second region
  and a resource policy that lets one role read it, with public policies blocked.

Parameters:
  ReplicaRegion:
    Type: String
    Default: us-west-2
    Description: Region that receives a read-only copy of the secret

  ReaderRoleArn:
    Type: String
    Description: ARN of the IAM role allowed to read the secret

Resources:
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/app-credentials'
      Description: Generated credentials replicated to a second region
      GenerateSecretString:
        SecretStringTemplate: '{"username": "appuser"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: '"@/\'
      ReplicaRegions:
        - Region: !Ref ReplicaRegion

  AppSecretPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref AppSecret
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowReaderRole
            Effect: Allow
            Principal:
              AWS: !Ref ReaderRoleArn
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: '*'

Outputs:
  SecretArn:
    Description: ARN of the secret
    Value: !Ref AppSecret