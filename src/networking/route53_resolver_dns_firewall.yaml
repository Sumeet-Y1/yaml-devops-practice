AWSTemplateFormatVersion: '2010-09-09'
Description: Route 53 Resolver DNS Firewall that blocks a list of domains for one VPC

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC protected by the firewall rule group

Resources:
  BlockedDomainList:
    Type: AWS::Route53Resolver::FirewallDomainList
    Properties:
      Name: !Sub '${AWS::StackName}-blocked-domains'
      Domains:
        - malware.example.com
        - '*.badsite.example.net'

  DnsFirewallRuleGroup:
    Type: AWS::Route53Resolver::FirewallRuleGroup
    Properties:
      Name: !Sub '${AWS::StackName}-rule-group'
      FirewallRules:
        - Action: BLOCK
          BlockResponse: NXDOMAIN
          FirewallDomainListId: !Ref BlockedDomainList
          Priority: 100

  RuleGroupAssociation:
    Type: AWS::Route53Resolver::FirewallRuleGroupAssociation
    Properties:
      Name: !Sub '${AWS::StackName}-association'
      FirewallRuleGroupId: !Ref DnsFirewallRuleGroup
      VpcId: !Ref VpcId
      Priority: 101
      MutationProtection: DISABLED

Outputs:
  DomainListId:
    Description: ID of the blocked domain list
    Value: !Ref BlockedDomainList
  RuleGroupId:
    Description: ID of the firewall rule group
    Value: !Ref DnsFirewallRuleGroup