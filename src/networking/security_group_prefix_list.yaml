AWSTemplateFormatVersion: '2010-09-09'
Description: Customer managed prefix list of office CIDRs referenced by a security group so one list controls many rules

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the security group

Resources:
  OfficePrefixList:
    Type: AWS::EC2::PrefixList
    Properties:
      PrefixListName: !Sub '${AWS::StackName}-office-cidrs'
      AddressFamily: IPv4
      MaxEntries: 5
      Entries:
        - Cidr: 192.0.2.0/24
          Description: Main office
        - Cidr: 198.51.100.0/24
          Description: Branch office

  AdminSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allows SSH only from the office prefix list
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourcePrefixListId: !Ref OfficePrefixList

Outputs:
  PrefixListId:
    Description: ID of the prefix list
    Value: !Ref OfficePrefixList
  SecurityGroupId:
    Description: ID of the admin security group
    Value: !Ref AdminSecurityGroup