AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Enables VPC Flow Logs for an existing VPC and delivers all traffic
  records to a CloudWatch Logs group through an IAM role.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to capture traffic for

Resources:
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/vpc/flow-logs/${AWS::StackName}'
      RetentionInDays: 14

  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteFlowLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogGroup.Arn

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref VpcId
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      MaxAggregationInterval: 60

Outputs:
  FlowLogId:
    Description: ID of the flow log
    Value: !Ref VpcFlowLog
  LogGroupName:
    Description: Log group that receives the records
    Value: !Ref FlowLogGroup