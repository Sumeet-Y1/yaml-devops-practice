AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Sends VPC Flow Logs for rejected traffic straight to S3 in Parquet
  format with a custom field list, Hive-compatible partitions, and hourly
  folders, so the logs are cheap to store and fast to query with Athena.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to capture rejected traffic for

Resources:
  FlowLogBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref VpcId
      ResourceType: VPC
      TrafficType: REJECT
      LogDestinationType: s3
      LogDestination: !GetAtt FlowLogBucket.Arn
      MaxAggregationInterval: 600
      LogFormat: '${version} ${account-id} ${interface-id} ${srcaddr} ${dstaddr} ${srcport} ${dstport} ${protocol} ${packets} ${bytes} ${action} ${log-status}'
      DestinationOptions:
        FileFormat: parquet
        HiveCompatiblePartitions: true
        PerHourPartition: true

Outputs:
  FlowLogBucketName:
    Description: Parquet flow log files are delivered here
    Value: !Ref FlowLogBucket

  FlowLogId:
    Description: ID of the flow log
    Value: !Ref VpcFlowLog