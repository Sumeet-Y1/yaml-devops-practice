AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates the three interface VPC endpoints that Session Manager needs
  (ssm, ssmmessages, ec2messages) so instances in private subnets can be
  managed with no NAT gateway and no internet access.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the endpoints

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for the endpoint network interfaces

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: VPC CIDR block allowed to reach the endpoints on port 443

Resources:
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS from inside the VPC to the endpoints
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr

  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      PrivateDnsEnabled: true

  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      PrivateDnsEnabled: true

  Ec2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ec2messages'
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      PrivateDnsEnabled: true

Outputs:
  SsmEndpointId:
    Description: Endpoint for the Systems Manager API
    Value: !Ref SsmEndpoint

  SsmMessagesEndpointId:
    Description: Endpoint for Session Manager data channels
    Value: !Ref SsmMessagesEndpoint

  Ec2MessagesEndpointId:
    Description: Endpoint for the SSM Agent message service
    Value: !Ref Ec2MessagesEndpoint