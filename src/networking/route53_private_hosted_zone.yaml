AWSTemplateFormatVersion: '2010-09-09'
Description: Route 53 private hosted zone attached to a VPC with one A record

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that can resolve the private zone
  DomainName:
    Type: String
    Default: internal.example.com
    Description: Private domain name

Resources:
  PrivateZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: Private zone for internal service names
      VPCs:
        - VPCId: !Ref VpcId
          VPCRegion: !Ref AWS::Region

  AppRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PrivateZone
      Name: !Sub 'app.${DomainName}'
      Type: A
      TTL: '300'
      ResourceRecords:
        - 10.0.0.25

Outputs:
  HostedZoneId:
    Description: ID of the private hosted zone
    Value: !Ref PrivateZone
  AppRecordName:
    Description: Fully qualified name of the A record
    Value: !Ref AppRecord