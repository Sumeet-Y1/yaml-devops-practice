AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an Application Load Balancer with listener rules for path-based
  routing: a fixed-response health endpoint, a forward rule for /api/*,
  and a redirect rule for /old/*. Everything else goes to the web target group.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the target groups and security group

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from the internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Protocol: HTTP
      Port: 80
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckPath: /

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Protocol: HTTP
      Port: 8080
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckPath: /api/health

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  HealthRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 5
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /health
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '200'
            ContentType: text/plain
            MessageBody: ok

  ApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  OldPathRedirectRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /old/*
      Actions:
        - Type: redirect
          RedirectConfig:
            Protocol: '#{protocol}'
            Host: '#{host}'
            Port: '#{port}'
            Path: '/new/#{path}'
            Query: '#{query}'
            StatusCode: HTTP_301

Outputs:
  AlbDnsName:
    Description: Try /health, /api/anything, and /old/page
    Value: !GetAtt LoadBalancer.DNSName

  WebTargetGroupArn:
    Description: Register web instances here
    Value: !Ref WebTargetGroup

  ApiTargetGroupArn:
    Description: Register API instances here
    Value: !Ref ApiTargetGroup