AWSTemplateFormatVersion: '2010-09-09'
Description: VPC interface endpoint (PrivateLink) for Secrets Manager with private DNS

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that gets the endpoint
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for the endpoint network interfaces
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security groups that allow HTTPS (443) from your workloads

Resources:
  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds: !Ref SecurityGroupIds

Outputs:
  EndpointId:
    Description: ID of the interface endpoint
    Value: !Ref SecretsManagerEndpoint