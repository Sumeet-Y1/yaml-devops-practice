AWSTemplateFormatVersion: '2010-09-09'
Description: Internal Network Load Balancer with a TCP listener forwarding to an IP target group

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the target group
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for the load balancer

Resources:
  AppNetworkLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: network
      Scheme: internal
      IpAddressType: ipv4
      Subnets: !Ref SubnetIds

  TcpTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 80
      Protocol: TCP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckProtocol: TCP
      HealthCheckIntervalSeconds: 30
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  TcpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AppNetworkLoadBalancer
      Port: 80
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TcpTargetGroup

Outputs:
  LoadBalancerDnsName:
    Description: DNS name of the load balancer
    Value: !GetAtt AppNetworkLoadBalancer.DNSName
  TargetGroupArn:
    Description: ARN of the target group
    Value: !Ref TcpTargetGroup