AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an Application Load Balancer that forces users to sign in through
  an Amazon Cognito user pool before it returns a response.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the load balancer security group

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets

  CertificateArn:
    Type: String
    Description: ACM certificate ARN for the HTTPS listener

  DomainPrefix:
    Type: String
    Description: Globally unique lowercase prefix for the Cognito hosted UI domain
    AllowedPattern: '[a-z0-9][a-z0-9-]{2,62}'

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS from the internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${AWS::StackName}-alb'
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: alb-client
      GenerateSecret: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Sub 'https://${LoadBalancer.DNSName}/oauth2/idpresponse'

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Order: 1
          Type: authenticate-cognito
          AuthenticateCognitoConfig:
            UserPoolArn: !GetAtt UserPool.Arn
            UserPoolClientId: !Ref UserPoolClient
            UserPoolDomain: !Ref UserPoolDomain
            OnUnauthenticatedRequest: authenticate
            Scope: openid
        - Order: 2
          Type: fixed-response
          FixedResponseConfig:
            StatusCode: '200'
            ContentType: text/plain
            MessageBody: Hello, you are signed in!

Outputs:
  AlbDnsName:
    Description: Point your domain at this, then browse to it over HTTPS
    Value: !GetAtt LoadBalancer.DNSName

  UserPoolId:
    Description: Create test users in this pool
    Value: !Ref UserPool