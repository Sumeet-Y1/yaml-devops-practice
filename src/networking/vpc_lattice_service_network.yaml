AWSTemplateFormatVersion: '2010-09-09'
Description: VPC Lattice service network associated with a VPC so its workloads can reach Lattice services

Parameters:
  NetworkName:
    Type: String
    Default: practice-network
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
    Description: Lowercase name of the service network
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to associate with the service network
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security groups that control traffic to the service network

Resources:
  PracticeServiceNetwork:
    Type: AWS::VpcLattice::ServiceNetwork
    Properties:
      Name: !Ref NetworkName
      AuthType: NONE

  VpcAssociation:
    Type: AWS::VpcLattice::ServiceNetworkVpcAssociation
    Properties:
      ServiceNetworkIdentifier: !Ref PracticeServiceNetwork
      VpcIdentifier: !Ref VpcId
      SecurityGroupIds: !Ref SecurityGroupIds

Outputs:
  ServiceNetworkArn:
    Description: ARN of the service network
    Value: !GetAtt PracticeServiceNetwork.Arn
  AssociationId:
    Description: ID of the VPC association
    Value: !Ref VpcAssociation