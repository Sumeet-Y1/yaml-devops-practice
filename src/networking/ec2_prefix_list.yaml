AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates a managed prefix list of office CIDR blocks and a security group
  that allows SSH from every CIDR in the list with a single rule.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the security group

Resources:
  OfficePrefixList:
    Type: AWS::EC2::PrefixList
    Properties:
      PrefixListName: !Sub '${AWS::StackName}-office-cidrs'
      AddressFamily: IPv4
      MaxEntries: 5
      Entries:
        - Cidr: 203.0.113.0/24
          Description: Pune office
        - Cidr: 198.51.100.0/24
          Description: Remote office

  SshSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH from the office prefix list
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourcePrefixListId: !Ref OfficePrefixList

Outputs:
  PrefixListId:
    Description: ID of the prefix list (reuse it in route tables and security groups)
    Value: !Ref OfficePrefixList

  SecurityGroupId:
    Description: Security group that uses the prefix list
    Value: !Ref SshSecurityGroup