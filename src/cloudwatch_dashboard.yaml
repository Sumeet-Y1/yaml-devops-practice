AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudWatch Dashboard - practice template

Resources:
  PracticeDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: practice-dashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 6,
              "height": 3,
              "properties": {
                "markdown": "## Practice Dashboard\nMonitoring key metrics"
              }
            }
          ]
        }

Outputs:
  DashboardName:
    Value: !Ref PracticeDashboard