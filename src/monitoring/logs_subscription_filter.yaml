AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Streams matching CloudWatch Logs events (ERROR or Exception) to a Lambda
  function in near real time using a subscription filter.

Resources:
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/practice/${AWS::StackName}/app'
      RetentionInDays: 7

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  LogProcessor:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      Code:
        ZipFile: |
          import base64
          import gzip
          import json

          def handler(event, context):
              payload = json.loads(gzip.decompress(base64.b64decode(event["awslogs"]["data"])))
              for log_event in payload["logEvents"]:
                  print("Matched:", log_event["message"])

  AllowLogsInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LogProcessor
      Action: lambda:InvokeFunction
      Principal: logs.amazonaws.com
      SourceArn: !GetAtt AppLogGroup.Arn

  ErrorSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: AllowLogsInvoke
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '?ERROR ?Exception'
      DestinationArn: !GetAtt LogProcessor.Arn

Outputs:
  LogGroupName:
    Description: Write log lines here to test the filter
    Value: !Ref AppLogGroup

  ProcessorFunctionName:
    Description: Function that receives matching events
    Value: !Ref LogProcessor