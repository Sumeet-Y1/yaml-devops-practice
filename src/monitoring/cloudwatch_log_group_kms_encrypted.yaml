AWSTemplateFormatVersion: '2010-09-09'
Description: CloudWatch log group encrypted with a customer managed KMS key that the Logs service is allowed to use

Resources:
  LogKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: Key for the encrypted log group
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountPermissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/practice/${AWS::StackName}/encrypted'

  EncryptedLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/practice/${AWS::StackName}/encrypted'
      RetentionInDays: 30
      KmsKeyId: !GetAtt LogKey.Arn

Outputs:
  LogGroupName:
    Description: Name of the encrypted log group
    Value: !Ref EncryptedLogGroup
  KeyArn:
    Description: ARN of the KMS key
    Value: !GetAtt LogKey.Arn