AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates two AWS Resource Groups: one that collects resources by tag and
  one that collects everything created by this stack.

Parameters:
  EnvironmentTag:
    Type: String
    Default: practice
    Description: Value of the Environment tag to group

Resources:
  TaggedResourcesGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: !Sub '${AWS::StackName}-by-tag'
      Description: All resources tagged with the chosen Environment value
      ResourceQuery:
        Type: TAG_FILTERS_1_0
        Query:
          ResourceTypeFilters:
            - AWS::AllSupported
          TagFilters:
            - Key: Environment
              Values:
                - !Ref EnvironmentTag

  StackResourcesGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: !Sub '${AWS::StackName}-by-stack'
      Description: Resources that belong to this CloudFormation stack
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
        Query:
          ResourceTypeFilters:
            - AWS::AllSupported
          StackIdentifier: !Ref AWS::StackId

Outputs:
  TaggedGroupArn:
    Description: ARN of the tag-based group
    Value: !GetAtt TaggedResourcesGroup.Arn

  StackGroupArn:
    Description: ARN of the stack-based group
    Value: !GetAtt StackResourcesGroup.Arn