AWSTemplateFormatVersion: '2010-09-09'
Description: CloudWatch log group with a data protection policy that audits and masks email addresses in log events

Resources:
  ProtectedLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/practice/${AWS::StackName}/protected'
      RetentionInDays: 14
      DataProtectionPolicy:
        Name: practice-data-protection
        Description: Audit and mask email addresses
        Version: '2021-06-01'
        Statement:
          - Sid: audit-policy
            DataIdentifier:
              - arn:aws:dataprotection::aws:data-identifier/EmailAddress
            Operation:
              Audit:
                FindingsDestination: {}
          - Sid: redact-policy
            DataIdentifier:
              - arn:aws:dataprotection::aws:data-identifier/EmailAddress
            Operation:
              Deidentify:
                MaskConfig: {}

Outputs:
  LogGroupName:
    Description: Name of the protected log group
    Value: !Ref ProtectedLogGroup