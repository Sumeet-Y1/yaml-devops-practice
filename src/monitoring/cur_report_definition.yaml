AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an AWS Cost and Usage Report (CUR) that delivers daily
  resource-level billing data to S3. Must be deployed in us-east-1.

Parameters:
  BucketPrefix:
    Type: String
    Default: practice-cur
    AllowedPattern: '[a-z0-9-]+'
    Description: Lowercase prefix for the report bucket

Rules:
  MustBeUsEast1:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: Cost and Usage Reports can only be created in us-east-1

Resources:
  ReportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketPrefix}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ReportBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReportBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowBillingReportsCheck
            Effect: Allow
            Principal:
              Service: billingreports.amazonaws.com
            Action:
              - s3:GetBucketAcl
              - s3:GetBucketPolicy
            Resource: !GetAtt ReportBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:cur:us-east-1:${AWS::AccountId}:definition/*'
          - Sid: AllowBillingReportsWrite
            Effect: Allow
            Principal:
              Service: billingreports.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${ReportBucket.Arn}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:cur:us-east-1:${AWS::AccountId}:definition/*'

  CostReport:
    Type: AWS::CUR::ReportDefinition
    DependsOn: ReportBucketPolicy
    Properties:
      ReportName: practice-daily-report
      TimeUnit: DAILY
      Format: textORcsv
      Compression: GZIP
      AdditionalSchemaElements:
        - RESOURCES
      S3Bucket: !Ref ReportBucket
      S3Prefix: cur
      S3Region: !Ref AWS::Region
      RefreshClosedReports: true
      ReportVersioning: OVERWRITE_REPORT

Outputs:
  ReportBucketName:
    Description: Billing reports arrive here within 24 hours
    Value: !Ref ReportBucket

  ReportName:
    Description: Name of the report definition
    Value: !Ref CostReport