AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates a CloudWatch Logs metric filter that counts ERROR lines, an alarm
  on that custom metric, and an SNS email notification.

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives the alarm
    AllowedPattern: '[^@\s]+@[^@\s]+\.[^@\s]+'

Resources:
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/practice/${AWS::StackName}/app'
      RetentionInDays: 7

  ErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '"ERROR"'
      MetricTransformations:
        - MetricNamespace: Practice/App
          MetricName: ErrorCount
          MetricValue: '1'
          DefaultValue: 0

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-error-count'
      Namespace: Practice/App
      MetricName: ErrorCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  LogGroupName:
    Description: Log group the filter watches
    Value: !Ref AppLogGroup

  AlarmName:
    Description: Name of the error alarm
    Value: !Ref ErrorAlarm