AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates a CloudWatch Internet Monitor that tracks internet performance
  and availability between users and a VPC-hosted application.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that hosts the application to monitor

Resources:
  AppInternetMonitor:
    Type: AWS::InternetMonitor::Monitor
    Properties:
      MonitorName: !Sub '${AWS::StackName}-monitor'
      Status: ACTIVE
      Resources:
        - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${VpcId}'
      TrafficPercentageToMonitor: 100
      MaxCityNetworksToMonitor: 100
      Tags:
        - Key: Purpose
          Value: user-experience

Outputs:
  MonitorArn:
    Description: ARN of the internet monitor
    Value: !GetAtt AppInternetMonitor.MonitorArn

  MonitorName:
    Description: Name of the internet monitor
    Value: !Ref AppInternetMonitor