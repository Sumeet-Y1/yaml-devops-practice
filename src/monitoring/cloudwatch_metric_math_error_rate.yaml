AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates a Lambda function and a CloudWatch alarm that uses metric math
  to alert when the error rate (errors divided by invocations) passes 5 percent.

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  AppFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return {"status": "ok"}

  ErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-error-rate'
      AlarmDescription: Error rate above 5 percent
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 5
      TreatMissingData: notBreaching
      Metrics:
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref AppFunction
            Period: 300
            Stat: Sum
        - Id: invocations
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref AppFunction
            Period: 300
            Stat: Sum
        - Id: errorRate
          Label: Error rate percent
          ReturnData: true
          Expression: IF(invocations > 0, 100 * errors / invocations, 0)

Outputs:
  AlarmName:
    Description: Name of the metric math alarm
    Value: !Ref ErrorRateAlarm

  FunctionName:
    Description: Function being monitored
    Value: !Ref AppFunction