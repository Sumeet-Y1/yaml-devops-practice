AWSTemplateFormatVersion: '2010-09-09'
Description: CloudWatch composite alarm that combines CPU and status check alarms for one EC2 instance

Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: Instance to monitor

Resources:
  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CPU above 80 percent
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  StatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Instance status check failed
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ServerHealthCompositeAlarm:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-server-health'
      AlarmDescription: Fires when either child alarm is in ALARM state
      AlarmRule: !Sub 'ALARM("${HighCpuAlarm}") OR ALARM("${StatusCheckAlarm}")'

Outputs:
  CompositeAlarmArn:
    Description: ARN of the composite alarm
    Value: !GetAtt ServerHealthCompositeAlarm.Arn