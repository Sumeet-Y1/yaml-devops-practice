AWSTemplateFormatVersion: "2010-09-09"
Description: Create CloudWatch log group and KMS key

Resources:
  DemoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: demo-log-group
      RetentionInDays: 14

  DemoKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Demo KMS key for encryption
      Enabled: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"
