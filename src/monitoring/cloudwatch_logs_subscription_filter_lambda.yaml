AWSTemplateFormatVersion: '2010-09-09'
Description: Subscription filter that streams matching log events from a log group to a Lambda function in near real time

Resources:
  SourceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  LogProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      Code:
        ZipFile: |
          import base64, gzip, json

          def handler(event, context):
              payload = gzip.decompress(base64.b64decode(event["awslogs"]["data"]))
              for log_event in json.loads(payload)["logEvents"]:
                  print(log_event["message"])

  LogsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LogProcessorFunction
      Action: lambda:InvokeFunction
      Principal: logs.amazonaws.com
      SourceArn: !GetAtt SourceLogGroup.Arn
      SourceAccount: !Ref AWS::AccountId

  ErrorSubscriptionFilter:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: LogsInvokePermission
    Properties:
      LogGroupName: !Ref SourceLogGroup
      FilterPattern: ERROR
      DestinationArn: !GetAtt LogProcessorFunction.Arn

Outputs:
  LogGroupName:
    Description: Log group being streamed
    Value: !Ref SourceLogGroup
  FunctionName:
    Description: Function that receives matching log events
    Value: !Ref LogProcessorFunction