AWSTemplateFormatVersion: '2010-09-09'
Description: X-Ray sampling rule for API requests and a group that filters slow or failing traces

Resources:
  ApiSamplingRule:
    Type: AWS::XRay::SamplingRule
    Properties:
      SamplingRule:
        RuleName: practice-api-sampling
        Priority: 100
        FixedRate: 0.1
        ReservoirSize: 1
        ServiceName: '*'
        ServiceType: '*'
        Host: '*'
        HTTPMethod: '*'
        URLPath: /api/*
        ResourceARN: '*'
        Version: 1

  SlowOrFailingGroup:
    Type: AWS::XRay::Group
    Properties:
      GroupName: slow-or-failing-requests
      FilterExpression: responsetime > 5 OR error = true
      InsightsConfiguration:
        InsightsEnabled: true
        NotificationsEnabled: false

Outputs:
  SamplingRuleArn:
    Description: ARN of the sampling rule
    Value: !Ref ApiSamplingRule
  GroupArn:
    Description: ARN of the X-Ray group
    Value: !GetAtt SlowOrFailingGroup.GroupARN