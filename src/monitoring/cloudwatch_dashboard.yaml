AWSTemplateFormatVersion: '2010-09-09'
Description: CloudWatch dashboard with Lambda invocation and error widgets for one function

Parameters:
  FunctionName:
    Type: String
    Default: my-function
    Description: Lambda function to chart

Resources:
  OverviewDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-overview'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Invocations",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${FunctionName}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Errors",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${FunctionName}"]
                ]
              }
            }
          ]
        }

Outputs:
  DashboardName:
    Description: Name of the dashboard
    Value: !Ref OverviewDashboard