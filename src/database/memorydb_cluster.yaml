AWSTemplateFormatVersion: '2010-09-09'
Description: MemoryDB for Redis cluster with one shard, one replica, TLS, and the default open-access ACL

Parameters:
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets in different Availability Zones for the cluster
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security groups allowed to reach the cluster

Resources:
  MemoryDbSubnetGroup:
    Type: AWS::MemoryDB::SubnetGroup
    Properties:
      SubnetGroupName: !Sub '${AWS::StackName}-subnets'
      Description: Subnets for the MemoryDB cluster
      SubnetIds: !Ref SubnetIds

  MemoryDbCluster:
    Type: AWS::MemoryDB::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-memorydb'
      Description: Durable in-memory database for practice
      NodeType: db.t4g.small
      ACLName: open-access
      EngineVersion: '7.1'
      NumShards: 1
      NumReplicasPerShard: 1
      TLSEnabled: true
      AutoMinorVersionUpgrade: true
      SubnetGroupName: !Ref MemoryDbSubnetGroup
      SecurityGroupIds: !Ref SecurityGroupIds

Outputs:
  ClusterEndpoint:
    Description: Endpoint address for connecting to the cluster
    Value: !GetAtt MemoryDbCluster.ClusterEndpoint.Address
  ClusterArn:
    Description: ARN of the cluster
    Value: !GetAtt MemoryDbCluster.ARN