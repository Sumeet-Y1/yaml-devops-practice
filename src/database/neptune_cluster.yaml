AWSTemplateFormatVersion: '2010-09-09'
Description: Amazon Neptune graph database cluster with one instance, encryption at rest, and IAM database authentication

Parameters:
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different Availability Zones
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security groups allowed to reach the cluster on port 8182

Resources:
  NeptuneSubnetGroup:
    Type: AWS::Neptune::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for the Neptune cluster
      SubnetIds: !Ref SubnetIds

  NeptuneCluster:
    Type: AWS::Neptune::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBSubnetGroupName: !Ref NeptuneSubnetGroup
      VpcSecurityGroupIds: !Ref SecurityGroupIds
      StorageEncrypted: true
      IamAuthEnabled: true
      BackupRetentionPeriod: 1
      DeletionProtection: false

  NeptuneInstance:
    Type: AWS::Neptune::DBInstance
    Properties:
      DBClusterIdentifier: !Ref NeptuneCluster
      DBInstanceClass: db.t4g.medium

Outputs:
  ClusterEndpoint:
    Description: Writer endpoint of the cluster
    Value: !GetAtt NeptuneCluster.Endpoint
  ClusterPort:
    Description: Port of the cluster
    Value: !Sub '${NeptuneCluster.Port}'