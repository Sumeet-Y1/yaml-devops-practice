AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an on-demand DynamoDB table with a local secondary index, a
  global secondary index, TTL, point-in-time recovery, encryption, and
  Contributor Insights.

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-orders'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customerId
          AttributeType: S
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: customerId
          KeyType: HASH
        - AttributeName: orderId
          KeyType: RANGE
      LocalSecondaryIndexes:
        - IndexName: customer-by-created
          KeySchema:
            - AttributeName: customerId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      GlobalSecondaryIndexes:
        - IndexName: status-by-created
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - customerId
              - orderId
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      ContributorInsightsSpecification:
        Enabled: true

Outputs:
  TableName:
    Description: Name of the table
    Value: !Ref OrdersTable

  GsiName:
    Description: Query by order status with this index
    Value: status-by-created

  LsiName:
    Description: Query one customer's orders by date with this index
    Value: customer-by-created