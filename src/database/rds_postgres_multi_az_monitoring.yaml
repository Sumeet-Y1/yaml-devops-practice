AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates a Multi-AZ RDS PostgreSQL instance with a managed master
  password, encryption, enhanced monitoring, Performance Insights, and
  log exports to CloudWatch.

Parameters:
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different Availability Zones

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group allowing TCP 5432 from your clients

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for the PostgreSQL instance
      SubnetIds: !Ref SubnetIds

  MonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: monitoring.rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

  PostgresInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.medium
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: true
      MasterUsername: postgres
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref SecurityGroupId
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: false
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt MonitoringRole.Arn
      EnablePerformanceInsights: true
      PerformanceInsightsRetentionPeriod: 7
      EnableCloudwatchLogsExports:
        - postgresql
        - upgrade

Outputs:
  Endpoint:
    Description: Database endpoint address
    Value: !GetAtt PostgresInstance.Endpoint.Address

  MasterSecretArn:
    Description: Secret holding the generated master password
    Value: !GetAtt PostgresInstance.MasterUserSecret.SecretArn