AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an Amazon Aurora PostgreSQL Serverless v2 cluster that scales
  between 0.5 and 4 ACUs, with a Secrets Manager managed master password.

Parameters:
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different Availability Zones

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group allowing TCP 5432 from your clients

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for Aurora Serverless v2
      SubnetIds: !Ref SubnetIds

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      MasterUsername: postgres
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds:
        - !Ref SecurityGroupId
      StorageEncrypted: true
      BackupRetentionPeriod: 1
      DeletionProtection: false
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 4

  WriterInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref AuroraCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless

Outputs:
  WriterEndpoint:
    Description: Cluster writer endpoint
    Value: !GetAtt AuroraCluster.Endpoint.Address

  MasterSecretArn:
    Description: Secret holding the master password
    Value: !GetAtt AuroraCluster.MasterUserSecret.SecretArn