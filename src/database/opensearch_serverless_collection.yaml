AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an Amazon OpenSearch Serverless search collection with the three
  policies it requires: encryption, network, and data access.

Parameters:
  CollectionName:
    Type: String
    Default: practice-docs
    AllowedPattern: '[a-z][a-z0-9-]{2,21}'
    Description: Collection name (3-22 chars so policy names stay under the limit)

  PrincipalArn:
    Type: String
    Description: ARN of the IAM user or role that may read and write the collection

Resources:
  EncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub '${CollectionName}-enc'
      Type: encryption
      Policy: !Sub |
        {"Rules":[{"ResourceType":"collection","Resource":["collection/${CollectionName}"]}],"AWSOwnedKey":true}

  NetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub '${CollectionName}-net'
      Type: network
      Policy: !Sub |
        [{"Rules":[{"ResourceType":"collection","Resource":["collection/${CollectionName}"]},{"ResourceType":"dashboard","Resource":["collection/${CollectionName}"]}],"AllowFromPublic":true}]

  DataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub '${CollectionName}-access'
      Type: data
      Policy: !Sub |
        [{"Rules":[{"ResourceType":"collection","Resource":["collection/${CollectionName}"],"Permission":["aoss:*"]},{"ResourceType":"index","Resource":["index/${CollectionName}/*"],"Permission":["aoss:*"]}],"Principal":["${PrincipalArn}"]}]

  SearchCollection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn: EncryptionPolicy
    Properties:
      Name: !Ref CollectionName
      Type: SEARCH
      Description: Practice search collection

Outputs:
  CollectionEndpoint:
    Description: HTTPS endpoint of the collection
    Value: !GetAtt SearchCollection.CollectionEndpoint

  DashboardEndpoint:
    Description: OpenSearch Dashboards endpoint
    Value: !GetAtt SearchCollection.DashboardEndpoint