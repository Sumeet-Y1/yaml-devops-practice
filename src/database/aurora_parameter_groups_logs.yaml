AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an Aurora MySQL cluster that uses a custom cluster parameter
  group (slow query log, time zone) and a custom instance parameter group,
  exports logs to CloudWatch, and turns on Performance Insights.

Parameters:
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different Availability Zones

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group allowing TCP 3306 from clients

Resources:
  ClusterParameterGroup:
    Type: AWS::RDS::DBClusterParameterGroup
    Properties:
      Description: Aurora MySQL 3 cluster settings
      Family: aurora-mysql8.0
      Parameters:
        slow_query_log: '1'
        long_query_time: '2'
        time_zone: Asia/Kolkata

  InstanceParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Aurora MySQL 3 instance settings
      Family: aurora-mysql8.0
      Parameters:
        max_connections: '200'

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for the Aurora cluster
      SubnetIds: !Ref SubnetIds

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-mysql
      MasterUsername: admin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBClusterParameterGroupName: !Ref ClusterParameterGroup
      VpcSecurityGroupIds:
        - !Ref SecurityGroupId
      StorageEncrypted: true
      BackupRetentionPeriod: 1
      DeletionProtection: false
      EnableCloudwatchLogsExports:
        - error
        - slowquery

  WriterInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref AuroraCluster
      Engine: aurora-mysql
      DBInstanceClass: db.t4g.medium
      DBParameterGroupName: !Ref InstanceParameterGroup
      EnablePerformanceInsights: true
      PerformanceInsightsRetentionPeriod: 7

Outputs:
  WriterEndpoint:
    Description: Cluster writer endpoint
    Value: !GetAtt AuroraCluster.Endpoint.Address

  ClusterParameterGroupName:
    Description: Cluster-level settings apply to every instance
    Value: !Ref ClusterParameterGroup