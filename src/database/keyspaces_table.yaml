AWSTemplateFormatVersion: '2010-09-09'
Description: Amazon Keyspaces keyspace and on-demand table with partition and clustering keys and point-in-time recovery

Parameters:
  KeyspaceName:
    Type: String
    Default: practice_keyspace
    AllowedPattern: '^[a-z][a-z0-9_]{0,47}$'
    Description: Keyspace name (underscores only, no hyphens)

Resources:
  PracticeKeyspace:
    Type: AWS::Cassandra::Keyspace
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      KeyspaceName: !Ref KeyspaceName

  OrdersTable:
    Type: AWS::Cassandra::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      KeyspaceName: !Ref PracticeKeyspace
      TableName: orders
      PartitionKeyColumns:
        - ColumnName: customer_id
          ColumnType: text
      ClusteringKeyColumns:
        - Column:
            ColumnName: order_date
            ColumnType: text
          OrderBy: DESC
      RegularColumns:
        - ColumnName: order_total
          ColumnType: decimal
      BillingMode:
        Mode: ON_DEMAND
      PointInTimeRecoveryEnabled: true

Outputs:
  KeyspaceName:
    Description: Name of the keyspace
    Value: !Ref PracticeKeyspace
  TableName:
    Description: Name of the orders table
    Value: !Ref OrdersTable