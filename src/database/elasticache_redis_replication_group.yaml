AWSTemplateFormatVersion: '2010-09-09'
Description: ElastiCache Redis replication group with Multi-AZ failover and encryption

Parameters:
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for the cache subnet group
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security groups allowed to reach the cache

Resources:
  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Subnets for the Redis replication group
      SubnetIds: !Ref SubnetIds

  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: Redis with one primary and one replica
      Engine: redis
      EngineVersion: '7.1'
      CacheNodeType: cache.t4g.micro
      NumCacheClusters: 2
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      Port: 6379
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds: !Ref SecurityGroupIds

Outputs:
  PrimaryEndpoint:
    Description: Primary endpoint address for writes
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address
  ReaderEndpoint:
    Description: Reader endpoint address for reads
    Value: !GetAtt RedisReplicationGroup.ReaderEndPoint.Address