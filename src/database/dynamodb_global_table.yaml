AWSTemplateFormatVersion: '2010-09-09'
Description: DynamoDB global table (version 2019.11.21) starting with one replica, ready to add more Regions

Resources:
  SessionsGlobalTable:
    Type: AWS::DynamoDB::GlobalTable
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${AWS::StackName}-sessions'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: SessionId
          AttributeType: S
      KeySchema:
        - AttributeName: SessionId
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Replicas:
        - Region: !Ref AWS::Region
          PointInTimeRecoverySpecification:
            PointInTimeRecoveryEnabled: true

Outputs:
  TableName:
    Description: Name of the global table
    Value: !Ref SessionsGlobalTable
  TableArn:
    Description: ARN of the global table
    Value: !GetAtt SessionsGlobalTable.Arn