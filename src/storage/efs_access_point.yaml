AWSTemplateFormatVersion: "2010-09-09"
Description: Create EFS Access Point

Resources:
  DemoEFS:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true

  DemoEFSAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref DemoEFS
      PosixUser:
        Uid: "1000"
        Gid: "1000"
      RootDirectory:
        CreationInfo:
          OwnerUid: "1000"
          OwnerGid: "1000"
          Permissions: "0755"
        Path: "/app-data"