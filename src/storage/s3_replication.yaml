AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Configures S3 replication from a source bucket to a destination bucket
  with versioning and a replication role. Same-region here; for cross-region
  replication, create the destination bucket in another region.

Parameters:
  BucketPrefix:
    Type: String
    Default: practice-repl
    AllowedPattern: '[a-z0-9-]+'
    Description: Lowercase prefix for both bucket names

Resources:
  ReplicationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReplicationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetReplicationConfiguration
                  - s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${BucketPrefix}-source-${AWS::AccountId}'
              - Effect: Allow
                Action:
                  - s3:GetObjectVersionForReplication
                  - s3:GetObjectVersionAcl
                  - s3:GetObjectVersionTagging
                Resource: !Sub 'arn:aws:s3:::${BucketPrefix}-source-${AWS::AccountId}/*'
              - Effect: Allow
                Action:
                  - s3:ReplicateObject
                  - s3:ReplicateDelete
                  - s3:ReplicateTags
                Resource: !Sub 'arn:aws:s3:::${BucketPrefix}-destination-${AWS::AccountId}/*'

  DestinationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketPrefix}-destination-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketPrefix}-source-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      ReplicationConfiguration:
        Role: !GetAtt ReplicationRole.Arn
        Rules:
          - Id: replicate-everything
            Status: Enabled
            Priority: 1
            Filter:
              Prefix: ''
            DeleteMarkerReplication:
              Status: Disabled
            Destination:
              Bucket: !GetAtt DestinationBucket.Arn
              StorageClass: STANDARD_IA

Outputs:
  SourceBucketName:
    Description: Upload objects here
    Value: !Ref SourceBucket

  DestinationBucketName:
    Description: Objects are replicated here
    Value: !Ref DestinationBucket