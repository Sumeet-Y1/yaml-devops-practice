AWSTemplateFormatVersion: '2010-09-09'
Description: S3 bucket with server access logging delivered to a separate log bucket

Resources:
  AccessLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub 'access-logs-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowServerAccessLogDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AccessLogBucket.Arn}/access-logs/*'
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:s3:::logged-${AWS::AccountId}-${AWS::Region}'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  LoggedBucket:
    Type: AWS::S3::Bucket
    DependsOn: AccessLogBucketPolicy
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub 'logged-${AWS::AccountId}-${AWS::Region}'
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogBucket
        LogFilePrefix: access-logs/

Outputs:
  LoggedBucketName:
    Description: Bucket whose requests are logged
    Value: !Ref LoggedBucket
  AccessLogBucketName:
    Description: Bucket that stores the access logs
    Value: !Ref AccessLogBucket