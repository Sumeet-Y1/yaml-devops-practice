AWSTemplateFormatVersion: '2010-09-09'
Description: S3 bucket that sends object-created events to EventBridge, where a rule routes them to an SQS queue

Resources:
  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub 'eb-events-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  UploadEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 86400

  UploadEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Send object-created events for the uploads bucket to SQS
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Sub 'eb-events-${AWS::AccountId}-${AWS::Region}'
      Targets:
        - Id: UploadEventsQueueTarget
          Arn: !GetAtt UploadEventsQueue.Arn

  UploadEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref UploadEventsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt UploadEventsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt UploadEventsRule.Arn

Outputs:
  BucketName:
    Description: Bucket that emits events to EventBridge
    Value: !Ref UploadsBucket
  QueueUrl:
    Description: Queue that receives the routed events
    Value: !Ref UploadEventsQueue