AWSTemplateFormatVersion: '2010-09-09'
Description: S3 Express One Zone directory bucket pinned to one Availability Zone ID for low-latency access

Parameters:
  AvailabilityZoneId:
    Type: String
    Default: use1-az4
    Description: Availability Zone ID (not name) where the directory bucket lives

Resources:
  DirectoryBucket:
    Type: AWS::S3Express::DirectoryBucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub 'practice-${AWS::AccountId}--${AvailabilityZoneId}--x-s3'
      DataRedundancy: SingleAvailabilityZone
      LocationName: !Ref AvailabilityZoneId
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  BucketName:
    Description: Name of the directory bucket
    Value: !Ref DirectoryBucket
  BucketArn:
    Description: ARN of the directory bucket
    Value: !GetAtt DirectoryBucket.Arn