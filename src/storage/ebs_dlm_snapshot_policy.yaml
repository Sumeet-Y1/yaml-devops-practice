AWSTemplateFormatVersion: '2010-09-09'
Description: Data Lifecycle Manager policy that snapshots tagged EBS volumes daily and keeps the last 7

Resources:
  DlmRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: dlm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  DailySnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: Daily snapshots of volumes tagged Backup=daily
      State: ENABLED
      ExecutionRoleArn: !GetAtt DlmRole.Arn
      PolicyDetails:
        ResourceTypes:
          - VOLUME
        TargetTags:
          - Key: Backup
            Value: daily
        Schedules:
          - Name: DailySnapshots
            CopyTags: true
            CreateRule:
              Interval: 24
              IntervalUnit: HOURS
              Times:
                - '03:00'
            RetainRule:
              Count: 7

Outputs:
  PolicyId:
    Description: ID of the lifecycle policy
    Value: !Ref DailySnapshotPolicy