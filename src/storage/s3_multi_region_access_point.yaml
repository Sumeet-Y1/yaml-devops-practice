AWSTemplateFormatVersion: '2010-09-09'
Description: S3 Multi-Region Access Point that gives one global endpoint in front of a regional bucket

Parameters:
  AccessPointName:
    Type: String
    Default: practice-mrap
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,48}[a-z0-9]$'
    Description: Lowercase name of the Multi-Region Access Point

Resources:
  RegionalBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub 'mrap-origin-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  GlobalAccessPoint:
    Type: AWS::S3::MultiRegionAccessPoint
    Properties:
      Name: !Ref AccessPointName
      Regions:
        - Bucket: !Ref RegionalBucket
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  AccessPointAlias:
    Description: Alias used to build the global endpoint
    Value: !GetAtt GlobalAccessPoint.Alias
  BucketName:
    Description: Regional bucket behind the access point
    Value: !Ref RegionalBucket