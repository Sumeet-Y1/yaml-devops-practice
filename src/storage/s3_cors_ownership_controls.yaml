AWSTemplateFormatVersion: '2010-09-09'
Description: S3 bucket with a CORS rule for a browser app and bucket owner enforced ownership so ACLs are disabled

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://example.com
    Description: Website origin allowed to call the bucket from a browser

Resources:
  AssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub 'assets-cors-${AWS::AccountId}-${AWS::Region}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AllowedOrigin
            AllowedMethods:
              - GET
              - PUT
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000

Outputs:
  BucketName:
    Description: Name of the bucket
    Value: !Ref AssetsBucket