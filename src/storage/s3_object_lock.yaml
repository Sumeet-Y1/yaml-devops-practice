AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an S3 bucket with Object Lock and a default retention rule, so
  objects cannot be deleted or overwritten for a set number of days (WORM storage).

Parameters:
  RetentionMode:
    Type: String
    Default: GOVERNANCE
    AllowedValues:
      - GOVERNANCE
      - COMPLIANCE
    Description: GOVERNANCE can be bypassed with permission, COMPLIANCE cannot be bypassed by anyone

  RetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Default retention period in days

Resources:
  LockedBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ObjectLockEnabled: true
      VersioningConfiguration:
        Status: Enabled
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: !Ref RetentionMode
            Days: !Ref RetentionDays
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  BucketName:
    Description: Objects written here are locked for the retention period
    Value: !Ref LockedBucket

  BucketArn:
    Description: ARN of the locked bucket
    Value: !GetAtt LockedBucket.Arn