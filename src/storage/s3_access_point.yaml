AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an S3 bucket and an S3 Access Point that gives one IAM principal
  read-only access to the data/ prefix, with access delegated through a bucket policy.

Parameters:
  AccessPointName:
    Type: String
    Default: practice-ap
    Description: Access point name (lowercase letters, numbers, hyphens)

  PrincipalArn:
    Type: String
    Description: ARN of the IAM user or role allowed to read through the access point

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DelegateToAccessPoints:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DelegateAccessToAccessPoints
            Effect: Allow
            Principal:
              AWS: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub '${DataBucket.Arn}/*'
            Condition:
              StringEquals:
                's3:DataAccessPointAccount': !Ref AWS::AccountId

  AppAccessPoint:
    Type: AWS::S3::AccessPoint
    DependsOn: DelegateToAccessPoints
    Properties:
      Bucket: !Ref DataBucket
      Name: !Ref AccessPointName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref PrincipalArn
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/${AccessPointName}/object/data/*'

Outputs:
  AccessPointArn:
    Description: ARN of the access point
    Value: !GetAtt AppAccessPoint.Arn

  BucketName:
    Description: Underlying bucket
    Value: !Ref DataBucket