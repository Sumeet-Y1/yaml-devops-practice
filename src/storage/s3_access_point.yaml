AWSTemplateFormatVersion: '2010-09-09'
Description: S3 bucket with an access point that has its own policy and public access block

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub 'ap-data-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DataAccessPoint:
    Type: AWS::S3::AccessPoint
    Properties:
      Name: !Sub 'ap-${AWS::AccountId}'
      Bucket: !Ref DataBucket
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Policy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountReadOnly
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !Sub 'arn:aws:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/ap-${AWS::AccountId}'
              - !Sub 'arn:aws:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/ap-${AWS::AccountId}/object/*'

Outputs:
  BucketName:
    Description: Name of the underlying bucket
    Value: !Ref DataBucket
  AccessPointName:
    Description: Name of the access point
    Value: !Ref DataAccessPoint