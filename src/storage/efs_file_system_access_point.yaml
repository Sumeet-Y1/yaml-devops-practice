AWSTemplateFormatVersion: '2010-09-09'
Description: Encrypted EFS file system with lifecycle policies, automatic backups, a mount target, and an access point

Parameters:
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for the mount target
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group that allows NFS (port 2049)

Resources:
  FileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      BackupPolicy:
        Status: ENABLED
      LifecyclePolicies:
        - TransitionToIA: AFTER_30_DAYS
        - TransitionToPrimaryStorageClass: AFTER_1_ACCESS

  MountTarget:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref SubnetId
      SecurityGroups:
        - !Ref SecurityGroupId

  AppAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser:
        Uid: '1001'
        Gid: '1001'
      RootDirectory:
        Path: /app
        CreationInfo:
          OwnerUid: '1001'
          OwnerGid: '1001'
          Permissions: '750'

Outputs:
  FileSystemId:
    Description: ID of the file system
    Value: !Ref FileSystem
  AccessPointId:
    Description: ID of the app access point
    Value: !Ref AppAccessPoint