AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an S3 Object Lambda access point that uppercases text files on
  the fly when they are read, without changing the stored objects.

Parameters:
  AccessPointName:
    Type: String
    Default: practice-ap
    AllowedPattern: '[a-z0-9-]+'
    Description: Name of the supporting access point (lowercase)

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SupportingAccessPoint:
    Type: AWS::S3::AccessPoint
    Properties:
      Bucket: !Ref DataBucket
      Name: !Ref AccessPointName

  TransformRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WriteGetObjectResponse
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3-object-lambda:WriteGetObjectResponse
                Resource: '*'

  UppercaseFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt TransformRole.Arn
      Code:
        ZipFile: |
          import urllib.request
          import boto3

          s3 = boto3.client("s3")

          def handler(event, context):
              ctx = event["getObjectContext"]
              with urllib.request.urlopen(ctx["inputS3Url"]) as response:
                  text = response.read().decode("utf-8")
              s3.write_get_object_response(
                  Body=text.upper(),
                  RequestRoute=ctx["outputRoute"],
                  RequestToken=ctx["outputToken"],
              )
              return {"statusCode": 200}

  ObjectLambdaAccessPoint:
    Type: AWS::S3ObjectLambda::AccessPoint
    Properties:
      Name: !Sub '${AccessPointName}-olap'
      ObjectLambdaConfiguration:
        SupportingAccessPoint: !GetAtt SupportingAccessPoint.Arn
        TransformationConfigurations:
          - Actions:
              - GetObject
            ContentTransformation:
              AwsLambda:
                FunctionArn: !GetAtt UppercaseFunction.Arn

Outputs:
  BucketName:
    Description: Upload .txt files here
    Value: !Ref DataBucket

  ObjectLambdaAccessPointArn:
    Description: Read objects through this ARN to get the transformed output
    Value: !GetAtt ObjectLambdaAccessPoint.Arn