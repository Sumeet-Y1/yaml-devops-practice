AWSTemplateFormatVersion: "2010-09-09"
Description: Create AWS CodePipeline for CI/CD

Resources:
  DemoPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: demo-pipeline
      RoleArn: !GetAtt DemoPipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref DemoPipelineBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: "1"
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                RepositoryName: demo-repo
                BranchName: main
        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              Configuration:
                ProjectName: demo-build-project
        - Name: Deploy
          Actions:
            - Name: DeployAction
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              InputArtifacts:
                - Name: BuildOutput
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: demo-stack
                Capabilities: CAPABILITY_NAMED_IAM

  DemoPipelineBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: demo-pipeline-artifacts

  DemoPipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: demo-pipeline-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodePipelineFullAccess
