AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
Description: >
  Uses the AWS::LanguageExtensions transform and Fn::ForEach to create one
  SQS queue per name in a list, without
  copy-pasting resource blocks.

Parameters:
  QueueNames:
    Type: CommaDelimitedList
    Default: Orders,Payments,Shipping
    Description: Queue names (letters and numbers only, used in logical IDs)

Resources:
  Fn::ForEach::Queues:
    - QueueName
    - !Ref QueueNames
    - '${QueueName}Queue':
        Type: AWS::SQS::Queue
        Properties:
          QueueName: ${QueueName}

Outputs:
  OrdersQueueUrl:
    Description: URL of the Orders queue (one of the queues created by the loop)
    Value: !Ref OrdersQueue
