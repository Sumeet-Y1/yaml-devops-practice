AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an AWS CodeDeploy application and deployment group that deploys
  to EC2 instances by tag, one at a time, with automatic rollback.

Parameters:
  InstanceTagValue:
    Type: String
    Default: web-server
    Description: Value of the Name tag on the target EC2 instances

Resources:
  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole

  Application:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub '${AWS::StackName}-app'
      ComputePlatform: Server

  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref Application
      DeploymentGroupName: production
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentConfigName: CodeDeployDefault.OneAtATime
      Ec2TagFilters:
        - Key: Name
          Value: !Ref InstanceTagValue
          Type: KEY_AND_VALUE
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE

Outputs:
  ApplicationName:
    Description: Name of the CodeDeploy application
    Value: !Ref Application

  DeploymentGroupName:
    Description: Name of the deployment group
    Value: !Ref DeploymentGroup