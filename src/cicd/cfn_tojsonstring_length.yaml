AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
Description: Fn::ToJsonString and Fn::Length from the language extensions used to build a JSON config stored in SSM

Parameters:
  AllowedPorts:
    Type: CommaDelimitedList
    Default: '80,443'
    Description: Ports to record in the configuration

Resources:
  AppConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/practice/${AWS::StackName}/config'
      Type: String
      Description: JSON configuration generated by Fn::ToJsonString
      Value:
        Fn::ToJsonString:
          environment: practice
          ports: !Ref AllowedPorts
          portCount:
            Fn::Length: !Ref AllowedPorts

Outputs:
  ParameterName:
    Description: Name of the SSM parameter that holds the JSON config
    Value: !Ref AppConfigParameter