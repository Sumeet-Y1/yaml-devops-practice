AWSTemplateFormatVersion: '2010-09-09'
Description: Encrypted gp3 EBS volume attached to an existing instance, with a final snapshot kept when the volume is deleted

Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: Instance that receives the volume
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone of the instance (the volume must be in the same one)

Resources:
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Size: 10
      VolumeType: gp3
      Iops: 3000
      Throughput: 125
      Encrypted: true
      Tags:
        - Key: Name
          Value: practice-data-volume

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref InstanceId
      VolumeId: !Ref DataVolume
      Device: /dev/sdf

Outputs:
  VolumeId:
    Description: ID of the data volume
    Value: !Ref DataVolume
  AttachmentId:
    Description: ID of the volume attachment
    Value: !Ref DataVolumeAttachment