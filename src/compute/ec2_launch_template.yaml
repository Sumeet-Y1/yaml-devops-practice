AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an EC2 launch template with the latest Amazon Linux 2023 AMI,
  IMDSv2 required, an encrypted gp3 root volume, and user data.

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: SSM parameter that resolves to the latest AMI

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type

Resources:
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-lt'
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 10
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: |
            #!/bin/bash
            dnf update -y
            dnf install -y nginx
            systemctl enable --now nginx
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-instance'

Outputs:
  LaunchTemplateId:
    Description: ID of the launch template
    Value: !Ref AppLaunchTemplate

  LatestVersion:
    Description: Latest version number
    Value: !GetAtt AppLaunchTemplate.LatestVersionNumber