AWSTemplateFormatVersion: '2010-09-09'
Description: Lambda function subscribed to an SNS topic with the invoke permission SNS needs

Resources:
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Alerts

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  AlertHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              for record in event["Records"]:
                  print(record["Sns"]["Message"])

  SnsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AlertHandlerFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref AlertsTopic

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: lambda
      Endpoint: !GetAtt AlertHandlerFunction.Arn

Outputs:
  TopicArn:
    Description: ARN of the alerts topic
    Value: !Ref AlertsTopic
  FunctionName:
    Description: Name of the handler function
    Value: !Ref AlertHandlerFunction