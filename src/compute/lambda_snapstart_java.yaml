AWSTemplateFormatVersion: '2010-09-09'
Description: Java Lambda function with SnapStart enabled for published versions to cut cold start time

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket that holds the function jar or zip
  CodeKey:
    Type: String
    Description: S3 key of the function package

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  SnapStartFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: java21
      Handler: com.example.Handler::handleRequest
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 512
      Timeout: 30
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      SnapStart:
        ApplyOn: PublishedVersions

  SnapStartVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref SnapStartFunction

  LiveAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref SnapStartFunction
      FunctionVersion: !GetAtt SnapStartVersion.Version
      Name: live

Outputs:
  AliasArn:
    Description: Invoke this alias so SnapStart is used
    Value: !Ref LiveAlias
  VersionNumber:
    Description: Published version with the snapshot
    Value: !Sub '${SnapStartVersion.Version}'