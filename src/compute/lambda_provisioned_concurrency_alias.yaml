AWSTemplateFormatVersion: '2010-09-09'
Description: Lambda alias with provisioned concurrency so a set number of execution environments stay warm

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  WarmFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 200, "body": "warm"}

  WarmFunctionVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref WarmFunction

  WarmAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref WarmFunction
      FunctionVersion: !GetAtt WarmFunctionVersion.Version
      Name: live
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: 2

Outputs:
  AliasArn:
    Description: ARN of the alias with provisioned concurrency
    Value: !Ref WarmAlias