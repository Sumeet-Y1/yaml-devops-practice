AWSTemplateFormatVersion: '2010-09-09'
Description: ECS Fargate service with a deployment circuit breaker that rolls back failed deployments

Parameters:
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets where the tasks run
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security groups attached to the tasks

Resources:
  AppCluster:
    Type: AWS::ECS::Cluster

  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-svc-web'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ContainerDefinitions:
        - Name: web
          Image: public.ecr.aws/nginx/nginx:stable
          Essential: true
          PortMappings:
            - ContainerPort: 80

  WebService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref AppCluster
      TaskDefinition: !Ref WebTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: !Ref SecurityGroupIds

Outputs:
  ServiceName:
    Description: Name of the ECS service
    Value: !GetAtt WebService.Name
  ClusterArn:
    Description: ARN of the cluster
    Value: !Ref AppCluster