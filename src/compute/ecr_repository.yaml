AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an Amazon ECR private repository with scan-on-push, immutable
  tags, encryption, and a lifecycle policy that expires old images.

Parameters:
  RepositoryName:
    Type: String
    Default: practice/app
    Description: Repository name (lowercase, may include slashes)

Resources:
  AppRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep only the last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Description: URI to use with docker push and pull
    Value: !GetAtt AppRepository.RepositoryUri

  RepositoryArn:
    Description: ARN of the repository
    Value: !GetAtt AppRepository.Arn