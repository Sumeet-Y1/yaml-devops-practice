AWSTemplateFormatVersion: '2010-09-09'
Description: Elastic IP allocated in a VPC and associated with an existing instance so its public address stays fixed

Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: Instance that receives the Elastic IP

Resources:
  InstanceEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: practice-instance-eip

  EipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt InstanceEip.AllocationId
      InstanceId: !Ref InstanceId

Outputs:
  PublicIp:
    Description: Elastic IP address
    Value: !Ref InstanceEip
  AllocationId:
    Description: Allocation ID of the Elastic IP
    Value: !GetAtt InstanceEip.AllocationId