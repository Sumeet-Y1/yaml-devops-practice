AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Triggers a Lambda function from a DynamoDB stream, with batch retries,
  batch bisecting, and an SQS queue that captures failed batches.

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  FailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  StreamProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaDynamoDBExecutionRole
      Policies:
        - PolicyName: SendFailuresToQueue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt FailureQueue.Arn

  StreamProcessor:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt StreamProcessorRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              for record in event["Records"]:
                  print(record["eventName"], record["dynamodb"].get("Keys"))

  StreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt OrdersTable.StreamArn
      FunctionName: !Ref StreamProcessor
      StartingPosition: LATEST
      BatchSize: 10
      MaximumRetryAttempts: 2
      BisectBatchOnFunctionError: true
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt FailureQueue.Arn

Outputs:
  TableName:
    Description: Write items here to trigger the function
    Value: !Ref OrdersTable

  FailureQueueUrl:
    Description: Failed batch metadata lands here
    Value: !Ref FailureQueue