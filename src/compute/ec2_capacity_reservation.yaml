AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 On-Demand Capacity Reservation that holds capacity in one Availability Zone with no end date

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    Description: Instance type to reserve
  InstanceCount:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Number of instances to reserve

Resources:
  PracticeCapacityReservation:
    Type: AWS::EC2::CapacityReservation
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      InstanceType: !Ref InstanceType
      InstancePlatform: Linux/UNIX
      InstanceCount: !Ref InstanceCount
      InstanceMatchCriteria: open
      EndDateType: unlimited
      Tenancy: default

Outputs:
  CapacityReservationId:
    Description: ID of the capacity reservation
    Value: !Ref PracticeCapacityReservation
  TotalInstanceCount:
    Description: Total number of instances reserved
    Value: !Sub '${PracticeCapacityReservation.TotalInstanceCount}'