AWSTemplateFormatVersion: '2010-09-09'
Description: Lambda function with a published version and a stable alias that points to it

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  AppFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 200, "body": "v1"}

  AppFunctionVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref AppFunction
      Description: Published version of the function

  LiveAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref AppFunction
      FunctionVersion: !GetAtt AppFunctionVersion.Version
      Name: live

Outputs:
  AliasArn:
    Description: ARN of the live alias (use this in triggers instead of the function ARN)
    Value: !Ref LiveAlias
  VersionNumber:
    Description: Published version number
    Value: !GetAtt AppFunctionVersion.Version