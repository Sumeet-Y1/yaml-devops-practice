AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 instance with an instance profile so it can be managed through Systems Manager without SSH

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: SSM parameter that resolves to the latest AMI
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet where the instance is launched

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  ManagedInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpTokens: required
      Tags:
        - Key: Name
          Value: ssm-managed-instance

Outputs:
  InstanceId:
    Description: ID of the instance
    Value: !Ref ManagedInstance
  RoleArn:
    Description: ARN of the instance role
    Value: !GetAtt InstanceRole.Arn