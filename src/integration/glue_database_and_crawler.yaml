AWSTemplateFormatVersion: '2010-09-09'
Description: Glue database and a scheduled crawler that catalogs raw files in S3 so Athena can query them

Resources:
  RawDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub 'glue-raw-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: ReadRawData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt RawDataBucket.Arn
                  - !Sub '${RawDataBucket.Arn}/raw/*'

  AnalyticsDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub '${AWS::StackName}_analytics'
        Description: Catalog database for raw data files

  RawDataCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub '${AWS::StackName}-raw-crawler'
      Role: !GetAtt CrawlerRole.Arn
      DatabaseName: !Ref AnalyticsDatabase
      Targets:
        S3Targets:
          - Path: !Sub 's3://${RawDataBucket}/raw/'
      Schedule:
        ScheduleExpression: cron(0 2 * * ? *)
      SchemaChangePolicy:
        UpdateBehavior: LOG
        DeleteBehavior: LOG

Outputs:
  DatabaseName:
    Description: Name of the Glue database
    Value: !Ref AnalyticsDatabase
  CrawlerName:
    Description: Name of the crawler
    Value: !Ref RawDataCrawler