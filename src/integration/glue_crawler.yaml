AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an AWS Glue crawler that scans an S3 bucket on a schedule and
  registers the discovered tables in a Glue Data Catalog database.

Parameters:
  DatabaseName:
    Type: String
    Default: practice_db
    AllowedPattern: '[a-z0-9_]+'
    Description: Glue database name (lowercase letters, numbers, underscores)

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  GlueCrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: ReadDataBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/*'

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref DatabaseName
        Description: Catalog database populated by the crawler

  DataCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub '${AWS::StackName}-crawler'
      Role: !GetAtt GlueCrawlerRole.Arn
      DatabaseName: !Ref GlueDatabase
      TablePrefix: raw_
      Targets:
        S3Targets:
          - Path: !Sub 's3://${DataBucket}/data/'
      Schedule:
        ScheduleExpression: cron(0 2 * * ? *)
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG

Outputs:
  DataBucketName:
    Description: Upload CSV or JSON files under the data/ prefix
    Value: !Ref DataBucket

  CrawlerName:
    Description: Name of the Glue crawler
    Value: !Ref DataCrawler

  GlueDatabaseName:
    Description: Glue Data Catalog database name
    Value: !Ref GlueDatabase