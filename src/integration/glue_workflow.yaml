AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an AWS Glue workflow that runs a crawler first, then runs an ETL
  job automatically when the crawler succeeds.

Parameters:
  DatabaseName:
    Type: String
    Default: workflow_db
    AllowedPattern: '[a-z0-9_]+'
    Description: Glue database name

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  GlueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: DataBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/*'

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref DatabaseName

  RawCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub '${AWS::StackName}-raw-crawler'
      Role: !GetAtt GlueRole.Arn
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          - Path: !Sub 's3://${DataBucket}/raw/'

  TransformJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${AWS::StackName}-transform-job'
      Role: !GetAtt GlueRole.Arn
      GlueVersion: '4.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Sub 's3://${DataBucket}/scripts/transform.py'

  EtlWorkflow:
    Type: AWS::Glue::Workflow
    Properties:
      Name: !Sub '${AWS::StackName}-etl-workflow'
      Description: Crawl raw data, then transform it

  StartTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: !Sub '${AWS::StackName}-start'
      Type: ON_DEMAND
      WorkflowName: !Ref EtlWorkflow
      Actions:
        - CrawlerName: !Ref RawCrawler

  JobTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: !Sub '${AWS::StackName}-after-crawl'
      Type: CONDITIONAL
      StartOnCreation: true
      WorkflowName: !Ref EtlWorkflow
      Predicate:
        Logical: AND
        Conditions:
          - LogicalOperator: EQUALS
            CrawlerName: !Ref RawCrawler
            CrawlState: SUCCEEDED
      Actions:
        - JobName: !Ref TransformJob

Outputs:
  WorkflowName:
    Description: Start this workflow from the console or CLI
    Value: !Ref EtlWorkflow

  DataBucketName:
    Description: Put data in raw/ and the job script in scripts/transform.py
    Value: !Ref DataBucket