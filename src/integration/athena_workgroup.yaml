AWSTemplateFormatVersion: '2010-09-09'
Description: Athena workgroup that enforces an encrypted results location and a per-query scan limit

Resources:
  ResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub 'athena-results-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AnalyticsWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub '${AWS::StackName}-analytics'
      Description: Workgroup with enforced settings and a cost guardrail
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 10485760
        ResultConfiguration:
          OutputLocation: !Sub 's3://${ResultsBucket}/results/'
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

Outputs:
  WorkGroupName:
    Description: Name of the Athena workgroup
    Value: !Ref AnalyticsWorkGroup
  ResultsBucketName:
    Description: Bucket that stores query results
    Value: !Ref ResultsBucket