AWSTemplateFormatVersion: "2010-09-09"
Description: Launch two EC2 instances

Resources:
  MyEC2Instance1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro   # free-tier eligible
      ImageId: ami-0c55b159cbfafe1f0   # Amazon Linux 2 AMI (example, region-specific)
      KeyName: my-keypair       # replace with your actual EC2 key pair name

  MyEC2Instance2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: ami-0c55b159cbfafe1f0
      KeyName: my-keypair