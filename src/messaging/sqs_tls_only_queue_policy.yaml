AWSTemplateFormatVersion: '2010-09-09'
Description: SQS queue with managed encryption, long polling, and a policy that denies any request not sent over TLS

Resources:
  SecureQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      ReceiveMessageWaitTimeSeconds: 20
      MessageRetentionPeriod: 345600

  SecureQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SecureQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt SecureQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  QueueUrl:
    Description: URL of the secure queue
    Value: !Ref SecureQueue