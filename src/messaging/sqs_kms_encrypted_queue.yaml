AWSTemplateFormatVersion: '2010-09-09'
Description: SQS queue encrypted with a customer managed KMS key and a data key reuse period

Resources:
  QueueKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: Key for the encrypted queue
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountPermissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'

  EncryptedQueue:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: !GetAtt QueueKey.Arn
      KmsDataKeyReusePeriodSeconds: 300
      MessageRetentionPeriod: 345600

Outputs:
  QueueUrl:
    Description: URL of the encrypted queue
    Value: !Ref EncryptedQueue
  KeyArn:
    Description: ARN of the KMS key
    Value: !GetAtt QueueKey.Arn