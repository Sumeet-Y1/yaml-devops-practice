AWSTemplateFormatVersion: '2010-09-09'
Description: SQS FIFO queue in high throughput mode with deduplication and throughput limits applied per message group

Resources:
  HighThroughputQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-high-throughput.fifo'
      FifoQueue: true
      ContentBasedDeduplication: true
      DeduplicationScope: messageGroup
      FifoThroughputLimit: perMessageGroupId

Outputs:
  QueueUrl:
    Description: URL of the FIFO queue
    Value: !Ref HighThroughputQueue
  QueueArn:
    Description: ARN of the FIFO queue
    Value: !GetAtt HighThroughputQueue.Arn