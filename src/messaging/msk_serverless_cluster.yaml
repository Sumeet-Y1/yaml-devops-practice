AWSTemplateFormatVersion: '2010-09-09'
Description: Amazon MSK Serverless Kafka cluster that uses IAM authentication and needs no broker sizing

Parameters:
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets in different Availability Zones for the cluster
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security groups for the cluster network interfaces

Resources:
  ServerlessKafkaCluster:
    Type: AWS::MSK::ServerlessCluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-kafka'
      VpcConfigs:
        - SubnetIds: !Ref SubnetIds
          SecurityGroups: !Ref SecurityGroupIds
      ClientAuthentication:
        Sasl:
          Iam:
            Enabled: true

Outputs:
  ClusterArn:
    Description: ARN of the serverless cluster
    Value: !Ref ServerlessKafkaCluster