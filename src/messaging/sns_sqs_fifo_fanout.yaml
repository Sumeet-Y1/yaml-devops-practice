AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an SNS FIFO topic that fans out ordered, deduplicated messages
  to an SQS FIFO queue.

Resources:
  OrdersTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-orders.fifo'
      FifoTopic: true
      ContentBasedDeduplication: true

  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-orders.fifo'
      FifoQueue: true
      ContentBasedDeduplication: true

  OrdersQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref OrdersQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt OrdersQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OrdersTopic

  OrdersSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrdersTopic
      Protocol: sqs
      Endpoint: !GetAtt OrdersQueue.Arn
      RawMessageDelivery: true

Outputs:
  TopicArn:
    Description: Publish with a MessageGroupId to keep order within a group
    Value: !Ref OrdersTopic

  QueueUrl:
    Description: Ordered messages arrive here
    Value: !Ref OrdersQueue