AWSTemplateFormatVersion: '2010-09-09'
Description: EventBridge connection and API destination that call an external HTTPS endpoint on an hourly schedule

Parameters:
  EndpointUrl:
    Type: String
    Default: https://example.com/webhook
    Description: HTTPS endpoint that receives the requests
  ApiKeyValue:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: API key sent in the x-api-key header

Resources:
  WebhookConnection:
    Type: AWS::Events::Connection
    Properties:
      Name: !Sub '${AWS::StackName}-connection'
      Description: API key authentication for the webhook
      AuthorizationType: API_KEY
      AuthParameters:
        ApiKeyAuthParameters:
          ApiKeyName: x-api-key
          ApiKeyValue: !Ref ApiKeyValue

  WebhookDestination:
    Type: AWS::Events::ApiDestination
    Properties:
      Name: !Sub '${AWS::StackName}-destination'
      ConnectionArn: !GetAtt WebhookConnection.Arn
      InvocationEndpoint: !Ref EndpointUrl
      HttpMethod: POST
      InvocationRateLimitPerSecond: 5

  InvokeDestinationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeApiDestination
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:InvokeApiDestination
                Resource: !GetAtt WebhookDestination.Arn

  HourlyWebhookRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Call the webhook every hour
      State: ENABLED
      ScheduleExpression: rate(1 hour)
      Targets:
        - Id: WebhookTarget
          Arn: !GetAtt WebhookDestination.Arn
          RoleArn: !GetAtt InvokeDestinationRole.Arn
          Input: '{"message": "hourly ping"}'

Outputs:
  ApiDestinationArn:
    Description: ARN of the API destination
    Value: !GetAtt WebhookDestination.Arn
  RuleName:
    Description: Name of the schedule rule
    Value: !Ref HourlyWebhookRule