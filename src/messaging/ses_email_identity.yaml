AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Configures Amazon SES with a verified email identity, a configuration
  set, and an SNS event destination for bounces and complaints.

Parameters:
  SenderEmail:
    Type: String
    Description: Email address to verify as a sender (SES sends a verification link)
    AllowedPattern: '[^@\s]+@[^@\s]+\.[^@\s]+'

Resources:
  SenderIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SenderEmail

  FeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-ses-feedback'

  FeedbackTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref FeedbackTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSesPublish
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: sns:Publish
            Resource: !Ref FeedbackTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  ConfigSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub '${AWS::StackName}-config-set'
      ReputationOptions:
        ReputationMetricsEnabled: true
      SendingOptions:
        SendingEnabled: true

  FeedbackDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    DependsOn: FeedbackTopicPolicy
    Properties:
      ConfigurationSetName: !Ref ConfigSet
      EventDestination:
        Name: bounces-and-complaints
        Enabled: true
        MatchingEventTypes:
          - bounce
          - complaint
        SnsDestination:
          TopicARN: !Ref FeedbackTopic

Outputs:
  ConfigurationSetName:
    Description: Use this when sending email
    Value: !Ref ConfigSet

  FeedbackTopicArn:
    Description: SNS topic that receives bounce and complaint events
    Value: !Ref FeedbackTopic