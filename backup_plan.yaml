AWSTemplateFormatVersion: "2010-09-09"
Description: Create AWS Backup vault and plan

Resources:
  DemoBackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: demo-backup-vault
      EncryptionKeyArn: arn:aws:kms::123456789012:key/abcd-1234-efgh-5678

  DemoBackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: demo-backup-plan
        Rules:
          - RuleName: DailyBackup
            TargetBackupVault: !Ref DemoBackupVault
            ScheduleExpression: cron(0 12 * * ? *)
            Lifecycle:
              DeleteAfterDays: 30
